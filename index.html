<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streamflux — Never lose a sale to poor follow-up.</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --text: #0a0a0a;
    --text-dim: rgba(0,0,0,0.55);
    --aqua: #2AB8D4;
    --border: rgba(0,0,0,0.08);
  }

  html, body {
    height: 100%;
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  /* subtle aqua glow, matches brand */
  body::before {
    content: '';
    position: absolute;
    top: -20%;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 700px;
    background: radial-gradient(ellipse at 50% 30%, rgba(42,184,212,0.10) 0%, rgba(42,184,212,0.04) 35%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
    max-width: 560px;
  }

  .wordmark {
    font-family: 'Syne', sans-serif;
    font-size: clamp(32px, 6vw, 48px);
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 28px;
    display: inline-flex;
    align-items: flex-start;
  }
  .wordmark .stream { color: var(--text); }
  .wordmark .flux { color: var(--aqua); }
  .wordmark sup {
    font-size: 13px;
    font-weight: 700;
    color: var(--aqua);
    border: 1.5px solid var(--aqua);
    border-radius: 50%;
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-left: 4px;
    margin-top: 4px;
  }

  .tagline {
    font-family: 'Instrument Serif', Georgia, serif;
    font-style: italic;
    font-size: clamp(22px, 3.5vw, 30px);
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 18px;
    letter-spacing: -0.5px;
  }

  .sub {
    font-size: 15px;
    color: var(--text-dim);
    line-height: 1.7;
    margin-bottom: 40px;
    font-weight: 400;
  }

  .contact {
    display: inline-block;
    background: var(--aqua);
    color: #ffffff;
    font-weight: 700;
    font-size: 14px;
    padding: 14px 32px;
    border-radius: 10px;
    text-decoration: none;
    box-shadow: 0 4px 20px rgba(42,184,212,0.25);
    transition: opacity 0.2s, transform 0.2s;
  }
  .contact:hover { opacity: 0.92; transform: translateY(-2px); }

  footer {
    position: absolute;
    bottom: 24px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: rgba(0,0,0,0.35);
    z-index: 1;
  }
</style>
</head>
<body>

  <div class="content">
    <div class="wordmark">
      <span class="stream">STREAM</span><span class="flux">FLUX</span><sup>®</sup>
    </div>
    <p class="tagline">Never lose a sale to poor follow-up.</p>
    <p class="sub">An AI-powered follow-up engine for salespeople, across any industry. Launching soon.</p>
    <a href="mailto:francisco@streamflux.app" class="contact">francisco@streamflux.app</a>
  </div>

  <footer>© 2026 Streamflux AI Ltd — Registered in England and Wales</footer>

</body>
</html>
